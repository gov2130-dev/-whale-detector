name: حوت 54 - رادار التجميع 24 ساعة

on:
  schedule:
    # قبل السوق - 11:30 صباحا بتوقيتك = 8:30 صباحا بتوقيت السعودية
    - cron: '30 8 * * 1-5'
    # افتتاح السوق - 4:30 العصر بتوقيتك
    - cron: '30 13 * * 1-5'
    # بعد السوق - 11 مساء بتوقيتك تحضير بكرة
    - cron: '0 20 * * 1-5'
  workflow_dispatch:

jobs:
  hunt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install deps
        run: pip install yfinance requests numpy pandas pytz
      - name: Run Accumulation Radar
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: 13889370
        run: |
          python -c "
          import yfinance as yf, math, requests, os
          from datetime import datetime
          import pytz
          print('رادار التجميع شغال...')
          # يرسل تنبيه ان البوت فحص
          try:
              requests.post(f\"https://api.telegram.org/bot{os.getenv('BOT_TOKEN')}/sendMessage\", json={'chat_id': os.getenv('CHAT_ID'), 'text': f'👑 رادار الحوت فحص الساعة {datetime.now(pytz.timezone(\"Asia/Riyadh\")).strftime(\"%H:%M\")} - افتح التطبيق للنتائج kashf-hetan-2130.streamlit.app'}, timeout=10)
          except: pass
          "
